<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //Zamień listę 2D na listę 1D, używając pętli i do sprawdzenia funkcji Array.isArray
        let arr2D = [[1, 2], [3, 4], [5, [6, 7]]];
let arr1D = [];

function flattenArray(arr) {
    for (let i = 0; i < arr.length; i++) {
        if (Array.isArray(arr[i])) {
            flattenArray(arr[i]);
        } else {
            arr1D.push(arr[i]);
        }
    }
}

flattenArray(arr2D);

    </script>
</body>
</html>
