<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var a = prompt("Podaj liczbe")
        var tablica=[]
        for(var i=0;i<=a;i++){
            var suma=0;
            for(var j=1;j<i-1;j++){
                if(i%j==0){
                    suma=suma+j
                }
            }
            if(suma==i){
                suma=suma*suma
                tablica.push(suma)
            }
            if(tablica.includes(i)){
                document.write("<b>"+i+"</b> ")
            }else{
                document.write(i+" ")
            }
        }
    </script>
</body>
</html>
