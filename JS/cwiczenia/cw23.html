<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //Wypisz, który mamy dzień tygodnia i tydzień w roku, używając obiektu klasy Date
        let data=new Date()
        let day=data.getDay()
        let jan=new Date("2024-01-01")
        let roznica=data-jan
        document.write(`Day: ${day} week: ${Math.ceil(roznica/(24*60*60*1000*7))}`)
    </script>
</body>
</html>
