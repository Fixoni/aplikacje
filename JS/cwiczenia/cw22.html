<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //Napisz funkcję, która przyjmuje dwie daty w formacie YYYY-MM-DD i wyznacza różnicę dni pomiędzy nimi
        let losowe=Math.ceil(Math.random()*999999999000)+1000
        let losowe2=Math.ceil(Math.random()*999999999000)+1000
        let d1=new Date(losowe)
        let d2=new Date(losowe2)
        document.write(d1+"</br>")
        document.write(d2+"</br>")
        document.write(Math.ceil(Math.abs((d1-d2)/(24*60*60*1000)))+"</br>")
        document.write(losowe)
    </script>
</body>
</html>
