<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>

        var a=prompt("Podaj a:")
        var b=prompt("Podaj b:")
        var c=prompt("Promt c:")
        a=parseInt(a)
        b=parseInt(b)
        c=parseInt(c)
        var delta=Math.pow(b,2)-4*a*c
        var x1,x2
        x1 = (-b+delta)/2*a
        x2 = (-b-delta)/2*a
        document.write(`Delta wynosi: ${delta} a miejsca zerowe to: ${x1}, ${x2}`)
    </script>
</body>
</html>
