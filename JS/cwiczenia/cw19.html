<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //Wyznacz silnię liczby, używając funkcji Array.prototype.reduce(). 
        let number = 5;
        let factorial = Array.from({ length: number }, (_, i) => i + 1).reduce((a, b) => a * b, 1);
        document.write(factorial)
    </script>
</body>
</html>
