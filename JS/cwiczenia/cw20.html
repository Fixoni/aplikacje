<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //Wyznacz średnią geometryczną (doczytaj sobie, jaki ma wzór matematyczny) podanej przez użytkownika listy
        //2,5,6,7,8,6,7,8,2
        let a=prompt("Podaj liste liczb: ")
        let b=a.split(",").length
        let geometric = (Math.pow(Array.from(a.split(",")).reduce((acc,product)=>acc*product,1),1/b)).toFixed(3);
        document.write(geometric)
    </script>
</body>
</html>
