<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let n = parseInt(prompt("Podaj liczbę całkowitą większą od 1:"))
        let suma = 0
        for (let i = 1;i <= n; i++) {
            if (i%10===0) {
                document.write("<b>" + i + "</b><br>")
                suma += i
            } else {
                document.write(i + "<br>")
            }
        }
        document.write("Suma liczb podzielnych przez 10: " + suma)
    </script>
</body>
</html>
