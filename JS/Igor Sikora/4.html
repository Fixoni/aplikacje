<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //zad.4
        //pobrac liczbe i wyznaczyc sume wszystkich jej dzielnikow
        let n = parseInt(prompt("Podaj liczbę: "))
        let suma = 0
        for (let i = 1; i <= n; i++) {
            if (n % i == 0) {
                suma += i
            }
        }
        document.write("Suma dzielników liczby " + n + " wynosi: " + suma)
    </script>
</body>
</html>
