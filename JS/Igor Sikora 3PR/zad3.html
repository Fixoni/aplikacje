<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var a=prompt("Podaj a:")
        var b=prompt("Podaj b:")
        var wybor=prompt("Chcesz obwod czy pole?")
        var pole,obwod
        if(a>0 && b>0){
        if(wybor=="pole"){
            pole=a*b
            document.write("Pole: "+pole+"<br>")
        }else if(wybor=="obwod"){
            obwod=2*a+2*b
            document.write("Obwod: "+obwod+"<br>")
        }
        }else{
            document.write("Podaj liczbe dodatnia")
        }
    </script>
</body>
</html>
