<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //dowolny lancuch gdzie pierwszy i ostatni znak bedzie najwiekszy a reszta najmniejsza
        let a="ala ma kota kot ma ale"
        for(let i=0;i<a.length;i++){
            if(i==0 || i==a.length-1){
                document.write(a[i].fontsize(7))
            }else{
                document.write(a[i].fontsize(1))
            }
        }
    </script>
</body>
</html>
